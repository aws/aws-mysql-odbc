name: Release Draft
# This workflow is triggered on creating tags
on:
  push:
    tags:
      - "*.*.*"

env:
  BUILD_TYPE: Release

permissions:
  id-token: write
  contents: write

jobs:
  build-mac:
    name: macOS
    runs-on: macos-15
    env:
      CMAKE_GENERATOR: Unix Makefiles
      ODBC_DM_INCLUDES: /opt/homebrew/include
      OPENSSL_ROOT_DIR: /Users/runner/openssl-3
    steps:
      - name: Checkout source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Configure build environment/dependencies
      - name: Install MySQL client libs & other dependencies
        run: |
          brew update
          brew install libiodbc mysql-client
          brew link --overwrite --force libiodbc

          curl -L https://dev.mysql.com/get/Downloads/MySQL-8.3/mysql-${{ vars.MYSQL_VERSION }}-macos14-arm64.tar.gz -o mysql.tar.gz
          tar -xzvf mysql.tar.gz

      - name: Cache OpenSSL 3
        id: cache-openssl
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/openssl-3
          key: ${{ runner.os }}-${{ runner.arch }}-openssl-3.5.8

      - name: Build and install OpenSSL 3
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        run: |
          curl -L https://github.com/openssl/openssl/releases/download/openssl-3.5.8/openssl-3.5.8.tar.gz -o openssl-3.5.8.tar.gz
          echo "a8f84a39918ec6415ce765d9b429d313ba97b8143169c172e734b9514464f5b2  openssl-3.5.8.tar.gz" | shasum -a 256 -c
          tar xf openssl-3.5.8.tar.gz
          cd openssl-3.5.8
          ./config no-tests --release --prefix=$HOME/openssl-3 --openssldir=$HOME/openssl-3/ssl --libdir=lib
          make -j$(sysctl -n hw.ncpu)
          make install_sw

      - name: Build and install AWS SDK C++
        working-directory: ./scripts
        run: |
          ./build_aws_sdk_unix.sh $BUILD_TYPE

      - name: Create build environment
        run: cmake -E make_directory ${{ github.workspace }}/build

      - name: Configure CMake
        run: cmake -S . -B build
          -G "$CMAKE_GENERATOR"
          -DCMAKE_BUILD_TYPE=$BUILD_TYPE
          -DMYSQLCLIENT_STATIC_LINKING=true
          -DODBC_INCLUDES=$ODBC_DM_INCLUDES
          -DCONNECTOR_PLATFORM=macos
          -DBUNDLE_DEPENDENCIES=true
          -DMYSQL_DIR=./mysql-${{ vars.MYSQL_VERSION }}-macos14-arm64

      - name: Build driver
        working-directory: ${{ github.workspace }}/build
        run: |
          export LIBRARY_PATH=$LIBRARY_PATH:$(brew --prefix zstd)/lib/
          cmake --build .

      - name: Build installer
        working-directory: ${{ github.workspace }}/build
        if: success()
        run: cpack .

      - name: Rename installer with architecture suffix
        working-directory: ${{ github.workspace }}/build
        if: success()
        run: |
          for pkg in aws-mysql-odbc-*-macos.pkg; do
            mv "$pkg" "${pkg%-macos.pkg}-macos-arm64.pkg"
          done

      - name: Upload macOS installer as artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installers-mac
          path: ${{ github.workspace }}/build/aws-mysql-odbc-*-macos-arm64.pkg
          if-no-files-found: error

  build-mac-intel:
    name: macOS Intel
    runs-on: macos-15-intel
    env:
      CMAKE_GENERATOR: Unix Makefiles
      ODBC_DM_INCLUDES: /usr/local/include
      OPENSSL_ROOT_DIR: /Users/runner/openssl-3
    steps:
      - name: Checkout source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Configure build environment/dependencies
      # Removing some /usr/local/bin files to avoid symlink issues wih brew update
      - name: Install MySQL client libs & other dependencies
        run: |
          rm '/usr/local/bin/2to3'
          rm '/usr/local/bin/2to3-3.11'
          rm '/usr/local/bin/idle3'
          rm '/usr/local/bin/idle3.11'
          rm '/usr/local/bin/pydoc3'
          rm '/usr/local/bin/pydoc3.11'
          rm '/usr/local/bin/python3'
          rm '/usr/local/bin/python3-config'
          rm '/usr/local/bin/python3.11'
          rm '/usr/local/bin/python3.11-config'

          brew update
          brew unlink unixodbc
          brew install libiodbc mysql-client
          brew link --overwrite --force libiodbc

          curl -L https://dev.mysql.com/get/Downloads/MySQL-8.3/mysql-${{ vars.MYSQL_VERSION }}-macos14-x86_64.tar.gz -o mysql.tar.gz
          tar -xzvf mysql.tar.gz

      - name: Cache OpenSSL 3
        id: cache-openssl
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/openssl-3
          key: ${{ runner.os }}-${{ runner.arch }}-openssl-3.5.8

      - name: Build and install OpenSSL 3
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        run: |
          curl -L https://github.com/openssl/openssl/releases/download/openssl-3.5.8/openssl-3.5.8.tar.gz -o openssl-3.5.8.tar.gz
          echo "a8f84a39918ec6415ce765d9b429d313ba97b8143169c172e734b9514464f5b2  openssl-3.5.8.tar.gz" | shasum -a 256 -c
          tar xf openssl-3.5.8.tar.gz
          cd openssl-3.5.8
          ./config no-tests --release --prefix=$HOME/openssl-3 --openssldir=$HOME/openssl-3/ssl --libdir=lib
          make -j$(sysctl -n hw.ncpu)
          make install_sw

      - name: Install OpenSSL 3 libs
        run: |
          rm -f /usr/local/lib/libssl.3.dylib
          rm -f /usr/local/lib/libcrypto.3.dylib
          ln -s $HOME/openssl-3/lib/libssl.3.dylib /usr/local/lib/
          ln -s $HOME/openssl-3/lib/libcrypto.3.dylib /usr/local/lib/

      - name: Build and install AWS SDK C++
        working-directory: ./scripts
        run: |
          ./build_aws_sdk_unix.sh $BUILD_TYPE

      - name: Create build environment
        run: cmake -E make_directory ${{ github.workspace }}/build

      - name: Configure CMake
        run: cmake -S . -B build
          -G "$CMAKE_GENERATOR"
          -DCMAKE_BUILD_TYPE=$BUILD_TYPE
          -DMYSQLCLIENT_STATIC_LINKING=true
          -DODBC_INCLUDES=$ODBC_DM_INCLUDES
          -DCONNECTOR_PLATFORM=macos
          -DBUNDLE_DEPENDENCIES=true
          -DMYSQL_DIR=./mysql-${{ vars.MYSQL_VERSION }}-macos14-x86_64

      - name: Build driver
        working-directory: ${{ github.workspace }}/build
        run: |
          export LIBRARY_PATH=$LIBRARY_PATH:$(brew --prefix zstd)/lib/
          cmake --build .

      - name: Build installer
        working-directory: ${{ github.workspace }}/build
        if: success()
        run: cpack .

      - name: Rename installer with architecture suffix
        working-directory: ${{ github.workspace }}/build
        if: success()
        run: |
          for pkg in aws-mysql-odbc-*-macos.pkg; do
            mv "$pkg" "${pkg%-macos.pkg}-macos-x86_64.pkg"
          done

      - name: Upload macOS Intel installer as artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installers-mac-intel
          path: ${{ github.workspace }}/build/aws-mysql-odbc-*-macos-x86_64.pkg
          if-no-files-found: error

  build-linux:
    name: Linux
    runs-on: ubuntu-latest
    env:
      CMAKE_GENERATOR: Unix Makefiles
      CXX: g++-11
      OPENSSL_ROOT_DIR: /home/runner/openssl-3
    steps:
      - name: Checkout source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Configure build environment/dependencies
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install
          g++-11
          build-essential
          libgtk-3-dev
          unixodbc
          unixodbc-dev
          libcurl4-openssl-dev uuid-dev zlib1g-dev # AWS SDK dependencies

      - name: Install MySQL client libs and include files
        run: |
          curl -L https://dev.mysql.com/get/Downloads/MySQL-8.3/mysql-${{ vars.MYSQL_VERSION }}-linux-glibc2.28-x86_64.tar.xz -o mysql.tar.gz
          tar xf mysql.tar.gz

      - name: Cache OpenSSL 3
        id: cache-openssl
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/openssl-3
          key: ${{ runner.os }}-${{ runner.arch }}-openssl-3.5.8

      - name: Build and install OpenSSL 3
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        run: |
          curl -L https://github.com/openssl/openssl/releases/download/openssl-3.5.8/openssl-3.5.8.tar.gz -o openssl-3.5.8.tar.gz
          echo "a8f84a39918ec6415ce765d9b429d313ba97b8143169c172e734b9514464f5b2  openssl-3.5.8.tar.gz" | sha256sum -c
          tar xf openssl-3.5.8.tar.gz
          cd openssl-3.5.8
          ./config no-tests --release --prefix=$HOME/openssl-3 --openssldir=$HOME/openssl-3/ssl --libdir=lib
          make -j$(nproc)
          make install_sw

      - name: Build and install AWS SDK C++
        working-directory: ./scripts
        run: |
          ./build_aws_sdk_unix.sh $BUILD_TYPE

      - name: Create build environment
        shell: bash
        run: cmake -E make_directory ${{ github.workspace }}/build

      - name: Configure CMake
        shell: bash
        run: cmake -S . -B build
          -G "$CMAKE_GENERATOR"
          -DCMAKE_BUILD_TYPE=$BUILD_TYPE
          -DMYSQLCLIENT_STATIC_LINKING=true
          -DWITH_UNIXODBC=1
          -DCONNECTOR_PLATFORM=linux
          -DMYSQL_DIR=./mysql-${{ vars.MYSQL_VERSION }}-linux-glibc2.28-x86_64/
          -DBUNDLE_DEPENDENCIES=true

      # Build driver
      - name: Build driver
        working-directory: ${{ github.workspace }}/build
        shell: bash
        run: cmake --build . --config $BUILD_TYPE

      - name: Build installer
        working-directory: ${{ github.workspace }}/build
        if: success()
        run: cpack .

      - name: Rename installer with platform suffix
        working-directory: ${{ github.workspace }}/build
        if: success()
        run: |
          for f in aws-mysql-odbc-*-linux.tar.gz; do
            mv "$f" "${f%-linux.tar.gz}-linux-ubuntu.tar.gz"
          done

      - name: Upload Linux installer as artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installers-linux
          path: ${{ github.workspace }}/build/aws-mysql-odbc-*-linux-ubuntu.tar.gz
          if-no-files-found: error

  build-al2023:
    name: Amazon Linux 2023
    runs-on:
      - codebuild-mysql-odbc-AL2023-${{ github.run_id }}-${{ github.run_attempt }}
    env:
      CMAKE_GENERATOR: Unix Makefiles
      OPENSSL_ROOT_DIR: /usr/local/openssl-3
    steps:
      - name: Checkout source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Print OS version
        run: cat /etc/os-release
      - name: Print default working directory
        run: pwd
      - name: Install build dependencies
        run: |
          sudo dnf update -y
          sudo dnf install cmake unixODBC unixODBC-devel libcurl-devel perl-core gcc -y
          sudo yum groupinstall "Development Tools" -y
      - name: Install MySQL client libs and include files
        run: |
          curl -L https://dev.mysql.com/get/Downloads/MySQL-8.3/mysql-${{ vars.MYSQL_VERSION }}-linux-glibc2.28-x86_64.tar.xz -o mysql.tar.gz
          tar xf mysql.tar.gz
      - name: Build and install OpenSSL 3
        run: |
          curl -L https://github.com/openssl/openssl/releases/download/openssl-3.5.8/openssl-3.5.8.tar.gz -o openssl-3.5.8.tar.gz
          echo "a8f84a39918ec6415ce765d9b429d313ba97b8143169c172e734b9514464f5b2  openssl-3.5.8.tar.gz" | sha256sum -c
          tar xf openssl-3.5.8.tar.gz
          cd openssl-3.5.8
          ./config no-tests --release --prefix=/usr/local/openssl-3 --openssldir=/usr/local/openssl-3/ssl --libdir=lib
          make -j$(nproc)
          sudo make install_sw
      - name: Build and install AWS SDK C++
        working-directory: ./scripts
        run: |
          ./build_aws_sdk_unix.sh $BUILD_TYPE
      - name: Configure CMake
        shell: bash
        run: cmake -S . -B build -G "$CMAKE_GENERATOR"
          -DCMAKE_BUILD_TYPE=$BUILD_TYPE
          -DMYSQLCLIENT_STATIC_LINKING=FALSE
          -DWITH_UNIXODBC=1
          -DCONNECTOR_PLATFORM=linux
          -DMYSQL_DIR=./mysql-${{ vars.MYSQL_VERSION }}-linux-glibc2.28-x86_64
          -DENABLE_UNIT_TESTS=FALSE
          -DDISABLE_GUI=TRUE
          -DBUNDLE_DEPENDENCIES=TRUE
      - name: Copy AWS SDK
        run: cp -r ./aws_sdk/install/lib64/*.so ./build/lib/
      - name: Build driver
        working-directory: ${{ github.workspace }}/build
        shell: bash
        run: cmake --build . --config $BUILD_TYPE
      - name: Build Installer
        working-directory: ${{ github.workspace }}/build
        if: success()
        run: cpack .
      - name: Rename installer with platform suffix
        working-directory: ${{ github.workspace }}/build
        if: success()
        run: |
          for f in aws-mysql-odbc-*-linux.tar.gz; do
            mv "$f" "${f%-linux.tar.gz}-linux-al2023.tar.gz"
          done

      - name: Upload AL2023 installer as artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installers-al2023
          path: ${{ github.workspace }}/build/aws-mysql-odbc-*-linux-al2023.tar.gz
          if-no-files-found: error

  build-windows:
    name: Windows
    runs-on: windows-latest
    env:
      CMAKE_GENERATOR: Visual Studio 18 2026
      WIX_DIR: "C:/Program Files (x86)/WiX Toolset v3.14/bin"
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - name: Checkout source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Configure build environment/dependencies
      - name: Install MySQL client libs
        run: |
          curl -L https://dev.mysql.com/get/Downloads/MySQL-8.3/mysql-${{ vars.MYSQL_VERSION }}-winx64.zip -o mysql.zip
          unzip -d C:/ mysql.zip

      - name: Cache OpenSSL 3
        id: cache-openssl
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: C:/openssl-3
          key: ${{ runner.os }}-openssl-3.5.8

      - name: Download OpenSSL 3 source
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl -L https://github.com/openssl/openssl/releases/download/openssl-3.5.8/openssl-3.5.8.tar.gz -o openssl-3.5.8.tar.gz
          echo "a8f84a39918ec6415ce765d9b429d313ba97b8143169c172e734b9514464f5b2  openssl-3.5.8.tar.gz" | sha256sum -c
          tar xf openssl-3.5.8.tar.gz
          choco install nasm -y --no-progress

      - name: Build and install OpenSSL 3
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        shell: cmd
        working-directory: openssl-3.5.8
        run: |
          for /f "usebackq tokens=*" %%i in (`vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          set "PATH=%ProgramFiles%\NASM;%PATH%"
          perl Configure VC-WIN64A no-tests --release --prefix=C:\openssl-3\x64 --openssldir=C:\openssl-3\x64\ssl
          nmake /NOLOGO
          nmake /NOLOGO install_sw

      - name: Install OpenSSL 3 DLLs
        run: |
          cp -r C:/openssl-3/x64/bin/libssl-3-x64.dll C:/Windows/System32/
          cp -r C:/openssl-3/x64/bin/libcrypto-3-x64.dll C:/Windows/System32/

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Build and install AWS SDK C++
        working-directory: ./scripts
        run: |
          .\build_aws_sdk_win.ps1 x64 ${{ env.BUILD_TYPE}} ON "${{env.CMAKE_GENERATOR}}"

      - name: Setup nmake
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Run build installer script
        run: |
          .\build_installer.ps1 x64 ${{ env.BUILD_TYPE}} "${{env.CMAKE_GENERATOR}}" C:/mysql-${{ vars.MYSQL_VERSION }}-winx64 "${{env.WIX_DIR}}" C:/openssl-3/x64/include/

      - name: Configure AWS credentials OIDC
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-skip-session-tagging: true
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_DEPLOY_ROLE }}
          role-session-name: mysql-win-signer

      - name: Configure AWS credentials Signer
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-skip-session-tagging: true
          role-chaining: true
          aws-region: us-west-2
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-external-id: ${{ secrets.AWS_ROLE_EXTERNAL_ID }}

      - name: Run signer script
        shell: pwsh
        working-directory: ./scripts
        run: |
          choco upgrade jq -y
          . ".\sign_installer.ps1"
          Invoke-SignInstaller ${{ github.workspace }}\wix winx64a ${{github.ref_name}} ${{ secrets.AWS_UNSIGNED_BUCKET }} ${{ secrets.AWS_SIGNED_BUCKET }} ${{ secrets.AWS_S3_KEY }}aws-mysql-odbc-${{github.ref_name}}-winx64a.msi

      - name: Upload Windows installer as artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installers-windows
          path: ${{ github.workspace }}/wix/*.msi
          if-no-files-found: error

  draft-release:
    name: Create Draft Release
    runs-on: ubuntu-latest
    needs: [ build-mac, build-mac-intel, build-linux, build-windows, build-al2023 ]
    steps:
      - name: Checkout source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Download all installers
        uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
        with:
          path: installers
          pattern: installers-*
          merge-multiple: true

      # Get tag version for release
      - name: Set Version Env Variable
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
      - name: 'Get Release Details'
        run: |
          export RELEASE_DETAILS="$(awk -vN=2 'n<N;/^## /{++n}' CHANGELOG.md)"
          export RELEASE_DETAILS="$(sed '${/^# /d;}' <<< "$RELEASE_DETAILS")"
          export RELEASE_DETAILS="$(sed '$d' <<< "$RELEASE_DETAILS")"
          touch RELEASE_DETAILS.md
          echo "$RELEASE_DETAILS" > RELEASE_DETAILS.md
      - name: Upload to Draft Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          draft: true
          name: "AWS ODBC Driver for MySQL - v${{ env.RELEASE_VERSION }}"
          bodyFile: RELEASE_DETAILS.md
          artifacts: "*/*.pkg, */*.tar.gz, */*.msi"
          token: ${{ secrets.GITHUB_TOKEN }}
